[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "garment-size-backend"
version = "1.0.0"
description = "Marker-free garment measurement, size classification and SQLite counting"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9",
  "numpy>=1.26,<3",
  "opencv-python>=4.10,<5",
  "torch>=2.2,<3",
  "ultralytics>=8.3,<9",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
release = ["pyinstaller>=6.12,<7"]

[tool.setuptools]
py-modules = ["main", "database"]
