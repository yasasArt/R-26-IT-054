[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "garment-counter-backend"
version = "1.0.3"
description = "Authenticated FastAPI, SQLite, and real-time AI vision sidecar for Garment Counter Desktop"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.8,<3",
    "openpyxl>=3.1,<4",
    "numpy>=1.26,<3",
    "opencv-python>=4.9,<5",
    "torch>=2.2,<3",
    "torchvision>=0.17,<1",
    "ultralytics>=8.2,<9",
    "openpyxl>=3.1,<4.0",
    "numpy>=1.26,<3.0",
    "Pillow>=10.0,<13.0",
    "torch>=2.6,<3.0",
    "torchvision>=0.21,<1.0",
    "ultralytics>=8.3,<9.0",
    "opencv-python>=4.10,<5.0",
    "python-multipart>=0.0.20,<1.0",
    "pyinstaller>=6.10,<7.0",
    "ruff>=0.11,<1.0"
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<10"]
release = ["pyinstaller>=6.10,<7"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
